name: Linux CI

on:
  push:
    branches: [main, codex/integrated-appliance-20260727]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INFOOS_STATE_HOME: ${{ runner.temp }}/infoos-state
      INFOOS_DATA_HOME: ${{ runner.temp }}/infoos-state/data
      INFOOS_LLM_CONFIG: ${{ runner.temp }}/infoos-state/config/llm.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install ".[dev,web]"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Prepare isolated InfoOS directories
        run: mkdir -p "$INFOOS_DATA_HOME" "$(dirname "$INFOOS_LLM_CONFIG")"

      - name: Run backend tests
        run: PYTHONPATH=. pytest tests/infoos -q

      - name: Run frontend tests
        run: npm --prefix frontend test -- --run

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run file-size guard
        run: python scripts/check_file_size.py

      - name: Run layer-deps guard
        run: python scripts/check_layer_deps.py

      - name: Run async-routes guard
        run: python scripts/check_async_routes.py

      - name: Run async-routes guard unit tests
        run: PYTHONPATH=. pytest tests/scripts/test_check_async_routes.py -q

      - name: Run pyflakes rules
        run: python -m pip install ruff==0.16.9 && ruff check backend scripts

      - name: Run read-model type check
        run: python -m pip install mypy==2.4.0 && mypy

      - name: Run guard unit tests
        run: PYTHONPATH=. pytest tests/scripts/test_check_file_size.py tests/scripts/test_check_layer_deps.py -q
