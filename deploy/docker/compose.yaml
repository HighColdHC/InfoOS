name: infoos

services:
  infoos:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        GOOGLE_CHROME_VERSION: ${INFOOS_CHROME_VERSION:-150.0.7871.114-1}
        GOOGLE_CHROME_SHA256: ${INFOOS_CHROME_SHA256:-0f19e68dca574849632e25229f15853d2beac33fa06498feed43f34628bc2d53}
        OPENCLI_VERSION: ${INFOOS_OPENCLI_VERSION:-1.8.6}
        OPENCLI_EXTENSION_VERSION: ${INFOOS_OPENCLI_EXTENSION_VERSION:-1.0.22}
        OPENCLI_EXTENSION_SHA256: ${INFOOS_OPENCLI_EXTENSION_SHA256:-31e9e7238c68f83a76d30b3fbde2bb0d76106588bb070d3fc5be6576422b9990}
        MIHOMO_VERSION: ${INFOOS_MIHOMO_VERSION:-1.19.29}
        MIHOMO_SHA256: ${INFOOS_MIHOMO_SHA256:-5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094}
        INFOOS_WITH_MIHOMO: ${INFOOS_WITH_MIHOMO:-0}
        TORCH_CPU_VERSION: ${INFOOS_TORCH_CPU_VERSION:-2.9.1+cpu}
        INFOOS_INSTALL_CUDA_ASR: ${INFOOS_INSTALL_CUDA_ASR:-0}
        INFOOS_SOURCE_COMMIT: ${INFOOS_SOURCE_COMMIT:?use deploy/docker/build-image.sh or set an exact full Git object ID}
    image: ${INFOOS_IMAGE:-infoos-appliance:local}
    container_name: ${INFOOS_CONTAINER_NAME:-${COMPOSE_PROJECT_NAME:-infoos}}
    restart: unless-stopped
    shm_size: ${INFOOS_SHM_SIZE:-1gb}
    mem_reservation: ${INFOOS_MEMORY_RESERVATION:-6g}
    mem_limit: ${INFOOS_MEMORY_LIMIT:-12g}
    memswap_limit: ${INFOOS_MEMORY_SWAP_LIMIT:-14g}
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - seccomp:chrome-seccomp.json
    ports:
      - "${INFOOS_BIND_ADDRESS:-127.0.0.1}:${INFOOS_HTTP_PORT:-8443}:5800"
    environment:
      USER_ID: ${INFOOS_UID:-1000}
      GROUP_ID: ${INFOOS_GID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      DISPLAY_WIDTH: ${INFOOS_DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${INFOOS_DISPLAY_HEIGHT:-1080}
      SECURE_CONNECTION: "1"
      WEB_AUTHENTICATION: "1"
      WEB_AUTHENTICATION_USERNAME: ${INFOOS_ADMIN_USERNAME:-}
      WEB_AUTHENTICATION_PASSWORD: ${INFOOS_ADMIN_PASSWORD:-}
      SERVICES_GRACETIME: "90000"
      INFOOS_BROWSER_CONSOLE_IDLE_SECONDS: ${INFOOS_BROWSER_CONSOLE_IDLE_SECONDS:-600}
      INFOOS_BROWSER_CONSOLE_MAX_SECONDS: ${INFOOS_BROWSER_CONSOLE_MAX_SECONDS:-1800}
      INFOOS_PUBLIC_BASE_URL: ${INFOOS_PUBLIC_BASE_URL:-}
      INFOOS_EDGE_READER_SECRET: ${INFOOS_EDGE_READER_SECRET:-}
      INFOOS_EMBEDDED_PROXY_ENABLED: ${INFOOS_EMBEDDED_PROXY_ENABLED:-0}
      INFOOS_EMBEDDED_PROXY_HOME: /var/lib/infoos/state/proxy
      INFOOS_EMBEDDED_PROXY_CONFIG: /var/lib/infoos/state/proxy/source.yaml
      INFOOS_EMBEDDED_PROXY_RUNTIME_DIR: /tmp/infoos-proxy
      INFOOS_EMBEDDED_PROXY_MIXED_PORT: "17897"
      INFOOS_EMBEDDED_PROXY_CONTROL_PORT: "19090"
      HTTP_PROXY: ${INFOOS_OUTBOUND_PROXY_URL:-}
      HTTPS_PROXY: ${INFOOS_OUTBOUND_PROXY_URL:-}
      NO_PROXY: ${INFOOS_NO_PROXY:-127.0.0.1,localhost}
      http_proxy: ${INFOOS_OUTBOUND_PROXY_URL:-}
      https_proxy: ${INFOOS_OUTBOUND_PROXY_URL:-}
      no_proxy: ${INFOOS_NO_PROXY:-127.0.0.1,localhost}
      INFOOS_BROWSER_PROXY_URL: ${INFOOS_BROWSER_PROXY_URL:-}
      INFOOS_PUBLIC_DOCUMENT_SHADOW_PROVIDER: ${INFOOS_PUBLIC_DOCUMENT_SHADOW_PROVIDER:-}
      INFOOS_WIGOLO_SHADOW_BASE_URL: ${INFOOS_WIGOLO_SHADOW_BASE_URL:-}
      INFOOS_WIGOLO_SHADOW_TOKEN_FILE: ${INFOOS_WIGOLO_SHADOW_TOKEN_FILE:-/var/lib/infoos/state/providers/wigolo.token}
      INFOOS_WIGOLO_SHADOW_TIMEOUT_SECONDS: ${INFOOS_WIGOLO_SHADOW_TIMEOUT_SECONDS:-45}
      INFOOS_BROWSER_RUNTIME: supervised-container
      INFOOS_SCHEDULER_INTERVAL_SECONDS: ${INFOOS_SCHEDULER_INTERVAL_SECONDS:-900}
      INFOOS_MAX_ATTEMPTS: ${INFOOS_MAX_ATTEMPTS:-2}
      INFOOS_PUBLIC_FETCH_WORKERS: ${INFOOS_PUBLIC_FETCH_WORKERS:-4}
      INFOOS_BROWSER_FETCH_WORKERS: ${INFOOS_BROWSER_FETCH_WORKERS:-2}
      INFOOS_BROWSER_FETCH_BATCH_LIMIT: ${INFOOS_BROWSER_FETCH_BATCH_LIMIT:-2}
      INFOOS_URGENT_MEDIA_WORKERS: ${INFOOS_URGENT_MEDIA_WORKERS:-4}
      INFOOS_CARD_PIPELINE_WORKERS: ${INFOOS_CARD_PIPELINE_WORKERS:-4}
      INFOOS_GPU_ASR_WORKERS: ${INFOOS_GPU_ASR_WORKERS:-1}
      INFOOS_MAINTENANCE_IO_WORKERS: ${INFOOS_MAINTENANCE_IO_WORKERS:-1}
      INFOOS_MEDIA_COMPUTE_SLOTS: ${INFOOS_MEDIA_COMPUTE_SLOTS:-2}
      INFOOS_RESOURCE_PRESSURE_FULL_AVG10: ${INFOOS_RESOURCE_PRESSURE_FULL_AVG10:-1.0}
      INFOOS_RESOURCE_MIN_AVAILABLE_MIB: ${INFOOS_RESOURCE_MIN_AVAILABLE_MIB:-4096}
      INFOOS_MEMORY_SOFT_LIMIT_MIB: ${INFOOS_MEMORY_SOFT_LIMIT_MIB:-10240}
      INFOOS_AUDIO_RETENTION_DAYS: ${INFOOS_AUDIO_RETENTION_DAYS:-7}
      INFOOS_AUDIO_RETENTION_BATCH: ${INFOOS_AUDIO_RETENTION_BATCH:-500}
      INFOOS_TASK_EVENT_HOT_WINDOW_DAYS: ${INFOOS_TASK_EVENT_HOT_WINDOW_DAYS:-30}
      INFOOS_TASK_EVENT_CRITICAL_HOT_WINDOW_DAYS: ${INFOOS_TASK_EVENT_CRITICAL_HOT_WINDOW_DAYS:-180}
      INFOOS_TASK_EVENT_ARCHIVE_BATCH_SIZE: ${INFOOS_TASK_EVENT_ARCHIVE_BATCH_SIZE:-2000}
      INFOOS_TASK_EVENT_ARCHIVE_MAX_ROWS: ${INFOOS_TASK_EVENT_ARCHIVE_MAX_ROWS:-50000}
      INFOOS_TASK_EVENT_ARCHIVE_MAX_SECONDS: ${INFOOS_TASK_EVENT_ARCHIVE_MAX_SECONDS:-300}
    volumes:
      - infoos-state:/var/lib/infoos/state
      - infoos-state:/config
      - infoos-data:/var/lib/infoos/data

volumes:
  infoos-state:
    name: ${INFOOS_STATE_VOLUME:-${COMPOSE_PROJECT_NAME:-infoos}-state}
  infoos-data:
    name: ${INFOOS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-infoos}-data}
