map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $upstream_http_cache_control $infoos_default_cache_control {
    "" no-cache;
    default "";
}

map $uri $infoos_cache_control {
    default $infoos_default_cache_control;
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/card-preview/assets/[^/]+(?:/thumbnail)?$ "private, max-age=604800";
}

server {
    include /var/tmp/nginx/listen.conf;
    include /var/tmp/nginx/ssl[.]conf;

    # The base authentication config remembers the URI that most recently
    # returned 401.  The React shell can keep polling APIs while the login page
    # is visible, so that URI is not a reliable post-login destination.  The
    # appliance management login always enters through the InfoOS home page.
    error_page 401 = @infoos_login_home;
    include /var/tmp/nginx/auth[.]conf;

    # Only the private management auth subrequest can produce this verdict.
    # Form sessions are still rechecked by account/console endpoints.
    auth_request_set $infoos_edge_authenticated $upstream_http_x_infoos_edge_authenticated;

    client_max_body_size 64m;
    add_header Cache-Control $infoos_cache_control;
    root /opt/noVNC;
    index index.html;

    location @infoos_login_home {
        auth_request off;
        absolute_redirect off;
        add_header Set-Cookie "login_success_url=/;Path=/";
        add_header Set-Cookie "login_failure_url=/login/;Path=/";
        return 302 /login/;
    }

    # Browsers request the favicon before the user has authenticated.  Do not
    # let that asset request overwrite the post-login destination cookie.
    location = /favicon.ico {
        auth_request off;
        access_log off;
        log_not_found off;
        return 204;
    }

    # Public plugin clients authenticate with the FastAPI Bearer contract.
    # Keep every other product/API route behind appliance gateway auth.
    location ^~ /api/plugin/v1/ {
        auth_request off;
        access_log off;
        # The mounted FastAPI plugin router contains GET-only routes and
        # rejects every other method. Avoid a nested nginx `if`: the base
        # image injects allow/deny rules into brace blocks during startup,
        # and nginx does not permit those directives inside `if`.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    # No endpoint exists at the bare prefix; avoid implicit slash redirects.
    location = /api/capture/v1 {
        auth_request off;
        return 404;
    }

    # Manual capture clients use only FastAPI Bearer + captures:write scope.
    location ^~ /api/capture/v1/ {
        auth_request off;
        access_log off;
        client_max_body_size 2228224;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_set_header X-InfoOS-Internal-Auth "";
        proxy_set_header X-InfoOS-Console-Grant "";
        proxy_set_header X-InfoOS-Original-Cookie "";
        proxy_set_header X-InfoOS-Original-Origin "";
        proxy_set_header X-InfoOS-Original-Referer "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-Method "";
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/mcp(?:/|$) {
        auth_request off;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 31m;
        proxy_pass http://127.0.0.1:8000;
    }

    # The backend repeats the method/path check; no nested nginx if blocks.
    location = /_infoos_reader_auth {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/internal/reader-authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-InfoOS-Internal-Auth 1;
        proxy_set_header X-InfoOS-Edge-Auth $http_x_infoos_edge_auth;
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_set_header X-InfoOS-Original-Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location = /api/internal/reader-authorize {
        auth_request off;
        return 404;
    }

    location ^~ /api/internal/ {
        auth_request off;
        return 404;
    }

    location = /_infoos_management_auth {
        internal;
        auth_request off;
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/internal/management-authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-InfoOS-Internal-Auth 1;
        proxy_set_header X-InfoOS-Edge-Auth $http_x_infoos_edge_auth;
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_set_header X-InfoOS-Original-Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /r/ {
        auth_request /_infoos_reader_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /assets/ {
        auth_request /_infoos_reader_auth;
        proxy_hide_header Cache-Control;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/card-preview/assets/[^/]+(?:/thumbnail)?$ {
        auth_request /_infoos_reader_auth;
        proxy_hide_header Cache-Control;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/card-preview(?:/[^/]+)?$ {
        auth_request /_infoos_reader_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/opportunities/(?:board|stats|[^/]+|[^/]+/follow-up)$ {
        auth_request /_infoos_reader_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/intelligence/(?:daily-brief/[^/]+|knowledge(?:/[^/]+)?)$ {
        auth_request /_infoos_reader_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_pass http://127.0.0.1:8000;
    }

    location = /browser-console {
        return 302 /browser-console/;
    }

    location = /_infoos_browser_console_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8000/api/browser/console-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-InfoOS-Internal-Auth 1;
        proxy_set_header X-InfoOS-Edge-Auth $http_x_infoos_edge_auth;
        proxy_set_header X-InfoOS-Edge-Authenticated "";
        proxy_set_header X-InfoOS-Console-Grant $cookie_infoos_browser_console;
        proxy_set_header X-InfoOS-Original-Cookie $http_cookie;
        proxy_set_header X-InfoOS-Original-Origin $http_origin;
        proxy_set_header X-InfoOS-Original-Referer $http_referer;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /browser-console/websockify {
        auth_request /_infoos_management_auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated $infoos_edge_authenticated;
        proxy_set_header X-InfoOS-Console-Grant $cookie_infoos_browser_console;
        proxy_set_header X-InfoOS-Original-Cookie $http_cookie;
        proxy_set_header X-InfoOS-Original-Origin $http_origin;
        proxy_set_header X-InfoOS-Original-Referer $http_referer;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 31m;
        proxy_send_timeout 31m;
        proxy_pass http://127.0.0.1:8000/api/browser/console-websocket;
    }

    location = /browser-console/heartbeat {
        auth_request /_infoos_management_auth;
        proxy_pass http://127.0.0.1:8000/api/browser/console-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-InfoOS-Internal-Auth 1;
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated $infoos_edge_authenticated;
        proxy_set_header X-InfoOS-Console-Grant $cookie_infoos_browser_console;
        proxy_set_header X-InfoOS-Original-Cookie $http_cookie;
        proxy_set_header X-InfoOS-Original-Origin $http_origin;
        proxy_set_header X-InfoOS-Original-Referer $http_referer;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /browser-console/ {
        auth_request /_infoos_browser_console_auth;
        alias /opt/noVNC/;
        index index.html;
    }

    location / {
        auth_request /_infoos_management_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-InfoOS-Internal-Auth "";
        proxy_set_header X-InfoOS-Edge-Auth "";
        proxy_set_header X-InfoOS-Edge-Authenticated $infoos_edge_authenticated;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8000;
    }
}
