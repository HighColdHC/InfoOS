<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · InfoOS</title>
  <link rel="stylesheet" href="styles/login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="brand-symbol" aria-hidden="true">i</span>InfoOS</div>
    <p class="eyebrow">你的个人情报工作台</p>
    <h1>欢迎回来</h1>
    <p class="intro">登录以浏览信息卡，管理你的采集与关注。</p>
    <p id="login-status" class="error" role="alert" hidden></p>
    <form id="login-form" action="/login/login" method="post">
      <label for="username">账户名</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="128" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">密码</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button id="toggle-password" class="toggle" type="button" aria-controls="password" aria-pressed="false">显示</button>
      </div>
      <button id="login-button" class="primary" type="submit">登录</button>
    </form>
    <p class="footer">私有设备 · 本地保存 · 由你掌控</p>
  </main>
</body>
</html>
