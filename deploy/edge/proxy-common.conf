# Include inside every InfoOS proxy location; location headers do not inherit.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-InfoOS-Internal-Auth "";
proxy_set_header X-InfoOS-Edge-Authenticated "";
proxy_set_header X-InfoOS-Console-Grant "";
proxy_set_header X-InfoOS-Original-Cookie "";
proxy_set_header X-InfoOS-Original-Origin "";
proxy_set_header X-InfoOS-Original-Referer "";
proxy_set_header X-Original-URI "";
proxy_set_header X-Original-Method "";
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";
proxy_set_header Remote-Email "";
proxy_set_header Remote-Name "";
proxy_set_header Proxy-Authorization "";
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/nginx/tls/appliance-ca.pem;
proxy_ssl_server_name on;
proxy_ssl_name APPLIANCE_CERTIFICATE_NAME;
proxy_read_timeout 31m;
proxy_send_timeout 31m;
proxy_buffering off;
