<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoOS</title>
    <script>
      // Set data-theme before first paint to avoid a flash of the wrong
      // theme for users with a stored preference or a system dark-mode
      // preference. Mirrors the runtime logic in ThemeProvider.tsx.
      (function () {
        try {
          var stored = window.localStorage.getItem("infoos.theme");
          var prefersDark = window.matchMedia
            && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage or matchMedia unavailable (e.g. private mode) —
          // fall through to :root defaults.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
